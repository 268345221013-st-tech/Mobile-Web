<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API vs GraphQL</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px 20px; 
            background-color: #0d0e12; 
            color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            margin: 0;
        }
        .container {
            max-width: 850px;
            width: 100%;
            background: #181922;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
        }
        h2 { margin-top: 0; font-size: 28px; font-weight: 700; color: #ffffff; }
        .subtitle { color: #a4b0be; font-size: 14px; margin-bottom: 30px; }
        hr { border: 0; border-top: 1px solid #282a36; margin-bottom: 30px; }
        .card-container { display: flex; gap: 25px; text-align: left; }
        .api-card { 
            flex: 1; 
            background: #1f202c; 
            padding: 25px; 
            border-radius: 10px; 
            border: 1px solid #2d2f3f;
        }
        .card-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        button { 
            width: 100%; padding: 14px; font-size: 16px; font-weight: bold; 
            border: none; border-radius: 8px; cursor: pointer; margin-bottom: 20px;
            transition: all 0.2s ease;
        }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-rest { background-color: #2ecc71; color: #0d0e12; }
        .btn-graphql { background-color: #9b59b6; color: white; }
        .result-box { 
            min-height: 90px; 
            padding: 15px; 
            background: #14151c; 
            border-radius: 8px; 
            font-size: 14px; 
            line-height: 1.7;
            border-left: 4px solid #3d4056;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>REST API vs GraphQL</h2>
        <div class="subtitle">ใบงานปฏิบัติการ ตอนที่ 3 — ระบบดึงข้อมูลผู้ใช้</div>

        <hr>
        
        <div class="card-container">
            <div class="api-card" style="border-top: 4px solid #2ecc71;">
                <div class="card-title" style="color: #2ecc71;">🟢 REST API</div>
                <button class="btn-rest" onclick="fetchWithREST()">ดึงข้อมูลด้วย REST</button>
                <div class="result-box" id="rest-result" style="border-left-color: #2ecc71;">
                    <span style="color: #636e72;">รอการกดปุ่ม...</span>
                </div>
            </div>

            <div class="api-card" style="border-top: 4px solid #9b59b6;">
                <div class="card-title" style="color: #9b59b6;">🟣 GraphQL</div>
                <button class="btn-graphql" onclick="fetchWithGraphQL()">ดึงข้อมูลด้วย GraphQL</button>
                <div class="result-box" id="graphql-result" style="border-left-color: #9b59b6;">
                    <span style="color: #636e72;">รอการกดปุ่ม...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchWithREST() {
            const resultElement = document.getElementById('rest-result');
            try {
                resultElement.innerHTML = "⏳ กำลังโหลด...";
                const response = await fetch('https://jsonplaceholder.typicode.com/users/3');
                if (!response.ok) throw new Error(`เกิดข้อผิดพลาด (${response.status})`);
                const data = await response.json();
                resultElement.innerHTML = `<b>ชื่อ :</b> ${data.name}<br><b>อีเมล :</b> ${data.email}`;
            } catch (error) {
                resultElement.innerHTML = `<span style="color:#e74c3c;">❌ ข้อผิดพลาด: ${error.message}</span>`;
            }
        }

        async function fetchWithGraphQL() {
            const resultElement = document.getElementById('graphql-result');
            try {
                resultElement.innerHTML = "⏳ กำลังโหลด...";
                const response = await fetch('https://graphqlzero.almansi.me/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: `query { user(id: 3) { name email } }`
                    })
                });
                if (!response.ok) throw new Error("ดึงข้อมูลล้มเหลว");
                const result = await response.json();
                const user = result.data.user;
                if (!user) throw new Error("ไม่พบข้อมูลผู้ใช้");
                resultElement.innerHTML = `<b>ชื่อ :</b> ${user.name}<br><b>อีเมล :</b> ${user.email}`;
            } catch (error) {
                resultElement.innerHTML = `<span style="color:#e74c3c;">❌ ข้อผิดพลาด: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
